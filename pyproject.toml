[project]
name = "everygpu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
model-partitioner = [
    "torch>=2.15",
    "safetensors>=0.8",
    "huggingface_hub>=2.4",
]
model-partitioner-outputs = [
    {include-group = "model-partitioner"},
    "transformers>=5.22",
    "accelerate>=1.15",
]

dev = ["black"]

[tool.uv]
package = false
