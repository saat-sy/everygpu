services:
  telemetry:
    image: grafana/otel-lgtm:0.30.0
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/pipeline.json
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - telemetry-data:/data
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pipeline.yaml:ro
      - ./grafana/pipeline.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/pipeline.json:ro
    restart: unless-stopped

volumes:
  telemetry-data:
